<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2535" viewBox="0 0 1800 2535">
<title>新聞 Graph × 雙層 LLM Wiki 架構</title>
<desc>新聞先形成單股票圖譜與共享 Layer 1 通用觀點，再以分類索引與使用者研究 Lens 檢索證據，融合為可追溯的 Layer 2 客製 Wiki。分類器是索引支援，Layer 2 不回寫 Layer 1。</desc>
