<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件知識庫 · StockNexus Wiki</title><link rel="stylesheet" href="/documents.css"></head>
<body><header><a href="/">← StockNexus Wiki</a><h1>文件知識庫</h1><select id="documentCollection" aria-label="知識庫"></select></header>
<main><aside>
<form id="importDocuments">
  <h2>匯入研究文件</h2>
  <label>知識庫 ID<input name="collection" value="my_research" pattern="[a-z0-9][a-z0-9_\-]{0,63}" maxlength="64" required></label>
  <label>來源 ID<input name="source" value="manuals" pattern="[a-z0-9][a-z0-9_\-]{0,63}" maxlength="64" required></label>
  <label>JSONL 檔案<input type="file" name="records" accept=".jsonl,.ndjson,application/x-ndjson" required></label>
  <button type="submit" value="apply">匯入並開啟圖譜</button>
  <button type="submit" value="preview">只預覽</button>
  <p id="importStatus" role="status"></p>
</form>
<h2>來源</h2><button id="refreshDocuments">重新讀取 DB</button><div id="documentChoices"></div><label for="layers">顯示層級</label><select id="layers"><option value="">全部節點</option><option value="documents">文件與章節</option><option>L1</option><option>L2</option></select><h2>文件目錄</h2><div id="outline"></div></aside>
<section class="canvas"><div id="docGraph"></div><output id="counts" aria-live="polite"></output></section>
<aside id="details"><h2>節點詳情</h2><p>點選目錄或圖上的節點。</p></aside></main>
<script src="/3d-force-graph.min.js"></script><script src="/documents.js"></script></body></html>
