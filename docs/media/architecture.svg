<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="1186" viewBox="0 0 1536 1186" role="img" aria-labelledby="title desc">
  <title id="title">StockNexus Wiki</title>
  <desc id="desc">The original illustrated research workflow, with two insets for L1 tree workers and independent document collections.</desc>
  <defs>
    <linearGradient id="mint" x2="0.15" y2="1"><stop stop-color="#eafaef"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#effaf5"/></linearGradient>
    <linearGradient id="apricot" x2=".1" y2="1"><stop stop-color="#fff6e9"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff8ed"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcf0ff"/></linearGradient>
    <linearGradient id="lilac" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eee4ff"/></linearGradient>
    <style>
      text {font-family:"Liberation Sans Narrow","Noto Sans CJK TC",sans-serif; fill:#0a1032}
      .heading {font-family:"DejaVu Serif","Noto Serif CJK TC",serif;font-size:25px;font-weight:bold}
      .body {font-size:20px;font-weight:bold}
      .note {font-size:18px}
      .step {font-size:19px;font-weight:bold;text-anchor:middle}
    </style>
    <g id="page" fill="white" stroke="#1770c1" stroke-linejoin="round" stroke-width="1.8">
      <path d="M-9-12H3L9-6V11H-9ZM3-12V-6H9"/><path d="M-5-2H4M-5 2H4M-5 6H1" fill="none"/>
    </g>
    <path id="arrow" d="M0 0h28m-7-6 7 6-7 6" fill="none" stroke="#252444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect width="1536" height="1186" fill="#fff"/>
  <switch>
    <image systemLanguage="zh" width="1536" height="1024" xlink:href="architecture-sources/original-zh-TW.png"/>
    <image width="1536" height="1024" xlink:href="architecture-sources/original-en.png"/>
  </switch>
  <!-- Regional Yahoo stories are discovered through Google News RSS. Keep the original source badge. -->
  <rect x="137" y="225" width="114" height="27" rx="4" fill="#fffafa"/>
  <text x="142" y="246" class="body">Yahoo News</text>

  <rect x="40" y="1031" width="453" height="138" rx="20" fill="url(#mint)" stroke="#13a570" stroke-width="1.5"/>
  <rect x="513" y="1031" width="990" height="138" rx="20" fill="url(#apricot)" stroke="#e39b4a" stroke-width="1.5"/>
  <g stroke="#19203d" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M105 1093v8c0 13-26 12-26 26m26-26c0 13 26 12 26 26"/>
  </g>
  <g transform="translate(105 1087)"><ellipse rx="18" ry="17" fill="url(#mint)" stroke="#1c995b"/><use xlink:href="#page" transform="scale(.85)"/></g>
  <g transform="translate(79 1135)"><circle r="14" fill="url(#blue)" stroke="#4188dc"/><use xlink:href="#page" transform="scale(.68)"/></g>
  <g transform="translate(131 1135)"><circle r="14" fill="url(#blue)" stroke="#4188dc"/><use xlink:href="#page" transform="scale(.68)"/></g>

  <image x="522" y="1048" width="105" height="107" xlink:href="architecture-sources/document-robot.png"/>
  <rect x="633" y="1084" width="205" height="44" rx="13" fill="url(#blue)" stroke="#537cd5"/>
  <use xlink:href="#arrow" x="843" y="1106"/>
  <rect x="878" y="1084" width="287" height="44" rx="13" fill="url(#apricot)" stroke="#e29542"/>
  <use xlink:href="#arrow" x="1170" y="1106"/>
  <rect x="1205" y="1084" width="272" height="44" rx="13" fill="url(#lilac)" stroke="#a16ddb"/>
  <switch>
    <g systemLanguage="zh" xml:lang="zh-TW">
      <text x="62" y="1062" class="heading">L1 · 新聞樹分工</text>
      <text x="162" y="1098" class="body">1、3、5 或 10 個 worker</text>
      <text x="162" y="1126" class="note">圖譜模式每次分領一棵新聞樹，</text>
      <text x="162" y="1151" class="note">可展開查看各自進度。</text>
      <text x="633" y="1064" class="heading">個人文件 · 獨立知識庫</text>
      <text x="735" y="1113" class="step">Agent 閱讀文章</text>
      <text x="1021" y="1113" class="step">預覽並匯入 records.jsonl</text>
      <text x="1341" y="1113" class="step">同一知識庫共用文件圖譜</text>
      <text x="637" y="1154" class="note">依原文連結文章、章節與引用。</text>
    </g>
    <g xml:lang="en">
      <text x="62" y="1062" class="heading">L1 · News tree workers</text>
      <text x="162" y="1098" class="body">1, 3, 5 or 10 workers</text>
      <text x="162" y="1126" class="note">Each takes one tree in graph mode.</text>
      <text x="162" y="1151" class="note">Expand progress to follow each worker.</text>
      <text x="633" y="1064" class="heading">Personal documents · Independent collection</text>
      <text x="735" y="1113" class="step">Agent reads articles</text>
      <text x="1021" y="1113" class="step">Preview and import records.jsonl</text>
      <text x="1341" y="1113" class="step">Shared document graph</text>
      <text x="637" y="1154" class="note">Links between articles, sections and citations follow evidence in the source text.</text>
    </g>
  </switch>
</svg>
